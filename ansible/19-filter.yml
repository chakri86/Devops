- name:  demo on filters
  hosts: local
  connection: local
  vars:
    topics: linux, shell, ansible, python
    tagMap:
      name: ansible
      project: roboshop
      environment: dev
    tagsList:  [{'key': 'name', 'value': 'ansible'}, {'key': 'project', 'value': 'roboshop'}, {'key': 'environment', 'value': 'dev'}]
    fullname: A V K CHakravarthi
  tasks: 
  - name: convert string to list
    debug:
      msg: "topics are {{topics | split(',') | list}}"

  - name: set default value
    debug:
      msg: "hi {{ greeting | default('good morning')  }}"

  - name: convert map to list
    debug:
      msg: "tagMap is {{ tagMap | dict2items }}"

  - name: convert list to map
    debug:
      msg: "tagsList is {{ tagsList | items2dict }}"

  - name: convert string to uppercase
    debug:
      msg: "full name is {{ fullname | upper }}"