- name:  configuring cart server
  hosts: cart
  become: yes
  tasks: 

  - name: disable nodejs default module
    command: dnf module disable nodejs -y

  - name: enable nodejs 20.x module
    command: dnf module enable nodejs:20 -y

  - name: install nodejs in server
    package:
      name: nodejs
      state: present

  - name: create system user for user
    user:
      name: roboshop
      system: yes
      home: /app
      shell: /sbin/nologin
      state: present
      comment: "Roboshop system user"

  - name: remove app directory if already exists
    file:
      path: /app
      state: absent

  - name: delete cart.zip in in tmp directiry
    file: 
      path: /tmp/cart.zip
      state: absent

  - name: create app directory
    file: 
      path: /app
      state: directory

  - name: download cart 
    get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip
      dest: /tmp/cart.zip

  - name: unzipping the user
    unarchive: 
      src: /tmp/cart.zip    
      dest:  /app
      remote_src: yes

  - name: install npm
    community.general.npm:
      path: /app

  - name: copy cart service
    template: 
      src: cart.service.j2
      dest: /etc/systemd/system/cart.service

  - name: deamon reload
    systemd_service:
      name: cart
      daemon_reload: true
      
  - name: enable and start cart
    service:
      name: cart
      state: restarted
      enabled: yes
