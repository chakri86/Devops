- name:  configuring shipping server
  hosts: shipping
  become: yes
  tasks: 

  - name: install maven and mysql
    package:
      name: "{{ item }}"
      state: present
    loop: 
      - maven
      - mysql  
  
  - name: create system user for shipping
    user:
      name: roboshop
      system: yes
      home: /app
      shell: /sbin/nologin
      state: present
      comment: "Roboshop system user"

  - name: remove app directory if already exists
    file:
      path: /app
      state: absent

  - name: delete shipping.zip in in tmo directiry
    file: 
      path: /tmp/shipping.zip
      state: absent

  - name: create app directory
    file: 
      path: /app
      state: directory

  - name: download shipping
    get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/shipping-v3.zip
      dest: /tmp/shipping.zip

  - name: unzipping the shipping
    unarchive: 
      src: /tmp/shipping.zip    
      dest:  /app
      remote_src: yes

  - name: install mvn clean package
    command: mvn clean package
    args: 
      chdir: /app

  - name: move shipping jar
    command: mv target/shipping-1.0.jar shipping.jar 
    args:
      chdir: /app    

  - name: copy shipping service
    template: 
      src: shipping.service.j2
      dest: /etc/systemd/system/shipping.service    

  - name: load mysql data
    ansible.mysql.mysql_db:
      state: import
      name: all
      login_user: root
      login_password: Roboshop@1
      login_host: "{{ MYSQL_HOST }}"
      target: 
    loop: 
    - /app/db/schema.sql
    - /app/db/app-user.sql 
    - /app/db/master-data.sql   