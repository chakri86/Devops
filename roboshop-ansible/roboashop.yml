- name: roboshop instance management
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq", "catalogue", "cart", "user", "shipping", "payment", "frontend"]
    image_id: ami-0220d79f3f480ecf5
    domine_name: avkc.online
    action: create
  tasks:  
  - name: create-ec2-instances
    amazon.aws.ec2_instance:
      instance_type: t3.micro
      name: "roboshop-{{ item }}"
      image_id: "{{ image_id }}"
      security_groups: 
      - "roboshop-{{ item }}"
      - roboshop-common
    loop: "{{ instances }}"
    register: ec2_output
    when : action == "create"

  # - name: print ec2-output
  #   debug:
  #     msg: "{{ ec2_output }}"

  # - name: create route53 record
  #   debug:
  #     msg: " Instance name is : {{ item.item }} and private ip is : {{ item.instances[0].private_ip_address }}"   
  #   loop: "{{ ec2_output.results }}"   

  - name: create route53 record
    amazon.aws.route53:
      state: present
      zone: "{{ domine_name }}"
      record: "{{ item.item }}.{{ domine_name }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: action == "create"

  - name: create route53 record for frontend
    amazon.aws.route53:
      state: present
      zone: "{{ domine_name }}"
      record: "{{ item.item }}.{{ domine_name }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: 
    - action == "create" 
    - item.item == "frontend"


  - name: delete-r53-records
    amazon.aws.route53:
      state: absent
      zone: "{{ domine_name }}"
      record: "{{ item }}.{{ domine_name }}"
      type: A
      ttl: 1
    loop: "{{ instances }}"
    when: action == "delete"

  - name: delete-r53-records-frontend
    amazon.aws.route53:
      state: absent
      zone: "{{ domine_name }}"
      record: "{{ domine_name }}"
      type: A
      ttl: 1
    loop: "{{ instances }}"
    when: 
    - action == "delete" 
    - item == "frontend"
    
